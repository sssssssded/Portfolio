<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 | Portfolio</title>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <div id="app" hidden>
    <header class="admin-top">
      <a class="logo" href="#profile"><span class="logo-mark">M</span><span>관리자</span></a>
      <span class="status" id="status">확인 중…</span>
      <div class="top-actions">
        <a class="btn btn-sm" href="../index.html" target="_blank" rel="noopener">사이트 보기 ↗</a>
        <button class="theme-toggle" type="button" aria-label="라이트/다크 모드 전환"></button>
        <button class="btn btn-sm" id="logout" type="button">로그아웃</button>
        <button class="btn btn-primary btn-sm" id="save" type="button" title="Ctrl+S">저장</button>
      </div>
    </header>

    <div class="admin-shell">
      <nav class="admin-nav" id="nav" aria-label="관리 메뉴"></nav>
      <main class="admin-main">
        <div class="banner" id="banner" hidden></div>
        <div id="view"></div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="../data/profile.js"></script>
  <script src="../data/projects.js"></script>
  <script src="../data/posts.js"></script>
  <script src="../js/common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
