<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="개발 포트폴리오 · 블로그">
  <script>try{var t=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=t||"dark"</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 공통 헤더 (탭 메뉴) -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html#about"><span class="logo-mark" data-logo-mark>P</span><span data-logo-text>Portfolio</span></a>
      <nav class="tabs" aria-label="메인 메뉴">
        <a class="tab" data-tab="about" href="index.html#about">소개</a>
        <a class="tab" data-tab="portfolio" href="index.html#portfolio">포트폴리오</a>
        <a class="tab" data-tab="blog" href="index.html#blog">블로그</a>
        <a class="tab" data-tab="contact" href="index.html#contact">연락처</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="라이트/다크 모드 전환"></button>
    </div>
  </header>

  <!-- 각 탭 내용은 js/main.js 가 data/*.js 를 읽어 채움 -->
  <main class="container">
    <section class="panel" data-panel="about" id="panel-about" hidden></section>
    <section class="panel" data-panel="portfolio" id="panel-portfolio" hidden></section>
    <section class="panel" data-panel="blog" id="panel-blog" hidden></section>
    <section class="panel" data-panel="contact" id="panel-contact" hidden></section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p data-footer></p>
      <div class="footer-links">
        <a href="#" data-admin-link>관리자</a>
        <a href="#" class="to-top">맨 위로 ↑</a>
      </div>
    </div>
  </footer>

  <script src="data/profile.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/posts.js"></script>
  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
